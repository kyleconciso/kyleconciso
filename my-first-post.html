<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Post - Blog</title>
    <style>
      :root {
        --bg-color: #f4f4f4;
        --text-color: #333;
        --link-color: #0077cc;
        --border-color: #ddd;
        --header-color: #111;
        --subtle-color: #666;
        --code-bg-color: #e9e9e9;
        --pre-bg-color: #fafafa;
      }
      [data-theme="dark"] {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --link-color: #58a6ff;
        --border-color: #333;
        --header-color: #f0f0f0;
        --subtle-color: #999;
        --code-bg-color: #2a2a2a;
        --pre-bg-color: #1e1e1e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.7;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
        padding: 2rem;
      }
      .container {
        max-width: 800px;
        margin: 2rem auto;
      }
      h1 {
        color: var(--header-color);
        line-height: 1.3;
        font-weight: 600;
        margin-bottom: 0.5rem;
        font-size: 2.5rem;
      }
      p {
        margin-bottom: 1rem;
      }
      .meta {
        color: var(--subtle-color);
        margin-bottom: 2rem;
      }
      a {
        color: var(--link-color);
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 2rem;
      }
      .theme-switcher {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        cursor: pointer;
        background: none;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        width: 36px;
        height: 36px;
        color: var(--text-color);
        font-size: 1.1rem;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="index.html" class="back-link">&larr; Back to Portfolio</a>

      <article>
        <h1>My First Post</h1>
        <p class="meta">Published on September 19, 2025</p>

        <p>This is the first post on my new blog. Welcome!</p>
        <p>
          Here, I plan to write about technology, my projects, and things I
          learn along the way as a computer science student. Stay tuned for more
          content.
        </p>
      </article>
    </div>
    <button id="theme-switcher" class="theme-switcher" title="Toggle dark mode">
      ◐
    </button>
    <script>
      const themeSwitcher = document.getElementById("theme-switcher");
      const doc = document.documentElement;
      const savedTheme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      doc.setAttribute("data-theme", savedTheme);
      themeSwitcher.addEventListener("click", () => {
        const currentTheme = doc.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        doc.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
      });
    </script>
  </body>
</html>
